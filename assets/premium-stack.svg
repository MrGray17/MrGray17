<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Animated technology backstage scene">
<style>
@media (prefers-reduced-motion: reduce){.motion{display:none}}
.display{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900;font-stretch:condensed;letter-spacing:-3px}
.meta{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:700;letter-spacing:.55px}
.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-weight:750;letter-spacing:-.25px}
.editorial{font-family:Georgia,"Times New Roman",serif;font-style:italic}
</style>
<defs><linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.86"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.32"/></linearGradient><filter id="soft"><feGaussianBlur stdDeviation="16"/></filter></defs>
<rect width="1200" height="620" fill="#E9E2FF"/><circle cx="1080" cy="90" r="128" fill="#55D6FF" opacity="0.54" filter="url(#soft)"/><circle cx="160" cy="540" r="144" fill="#B6FF4A" opacity="0.42" filter="url(#soft)"/><circle cx="995" cy="520" r="120" fill="#FF5CA8" opacity="0.34" filter="url(#soft)"/>
<rect x="26" y="26" width="1148" height="568" fill="none" stroke="#111111" stroke-width="5"/>
<text class="meta" x="52" y="76" font-size="15" fill="#111111">04 / BACKSTAGE</text>
<text class="display" x="50" y="150" font-size="68" textLength="505" lengthAdjust="spacingAndGlyphs" fill="#111111">WORKING SET</text>
<text class="editorial" x="54" y="184" font-size="20" fill="#111111">Current tools, shown as the paths they actually form</text>
