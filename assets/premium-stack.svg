<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Technology stack scene">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.34"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="#E9E2FF"/>
  <circle cx="1050" cy="86" r="110" fill="#55D6FF" opacity="0.65"/>
  <circle cx="938" cy="426" r="144" fill="#FF5CA8" opacity="0.48"/>
  <circle cx="150" cy="420" r="120" fill="#B6FF4A" opacity="0.60"/>
  <rect x="26" y="26" width="1148" height="448" fill="none" stroke="#111111" stroke-width="5"/>

  <text x="52" y="82" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#111111">04 / STACK</text>
  <text x="50" y="154" font-family="Impact, Arial Black, sans-serif" font-size="70" fill="#111111">WORKING SET</text>

  <g stroke="#111111" stroke-width="4">
    <rect x="52" y="190" width="354" height="120" rx="18" fill="url(#glass)"/>
    <rect x="424" y="190" width="316" height="120" rx="18" fill="url(#glass)"/>
    <rect x="758" y="190" width="390" height="120" rx="18" fill="url(#glass)"/>
    <rect x="52" y="328" width="520" height="110" rx="18" fill="url(#glass)"/>
    <rect x="590" y="328" width="558" height="110" rx="18" fill="url(#glass)"/>
  </g>

  <g font-family="Courier New, monospace" fill="#111111">
    <text x="76" y="225" font-size="15" font-weight="700">LANGUAGES</text>
    <text x="76" y="268" font-size="22" font-weight="700">TypeScript · JavaScript · C++</text>

    <text x="448" y="225" font-size="15" font-weight="700">BACKEND</text>
    <text x="448" y="268" font-size="22" font-weight="700">Node.js · Express</text>

    <text x="782" y="225" font-size="15" font-weight="700">FRONTEND</text>
    <text x="782" y="268" font-size="22" font-weight="700">React · Vite · MapLibre</text>

    <text x="76" y="362" font-size="15" font-weight="700">DATA / PROTOCOLS</text>
    <text x="76" y="405" font-size="22" font-weight="700">PostgreSQL · HTTP</text>

    <text x="614" y="362" font-size="15" font-weight="700">AI TOOLING</text>
    <text x="614" y="405" font-size="22" font-weight="700">MCP · LLM tooling · Bun</text>
  </g>

  <g>
    <circle cx="1120" cy="82" r="10" fill="#111111">
      <animateMotion dur="5s" repeatCount="indefinite" path="M0 0 C-120 40 -180 120 -250 70 S-390 -20 -470 55"/>
    </circle>
  </g>
</svg>