<g fill="#111111"><text class="meta" x="78" y="292" font-size="10">CLIENT</text><text class="ui" x="78" y="330" font-size="19">React · Vite</text><text class="ui" x="78" y="352" font-size="14">MapLibre</text><text class="meta" x="380" y="292" font-size="10">PROTOCOL</text><text class="ui" x="392" y="333" font-size="22">HTTP</text><text class="meta" x="590" y="292" font-size="10">API</text><text class="ui" x="590" y="330" font-size="19">Node.js</text><text class="ui" x="590" y="352" font-size="14">Express</text><text class="meta" x="890" y="292" font-size="10">DATA</text><text class="ui" x="890" y="333" font-size="20">PostgreSQL</text></g>
