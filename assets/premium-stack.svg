<text class="meta" x="54" y="414" font-size="11" fill="#111111">AI TOOLING PATH</text>
<g stroke="#111111" stroke-width="4" fill="url(#glass)"><rect x="54" y="434" width="300" height="92" rx="18"/><rect x="428" y="434" width="220" height="92" rx="18"/><rect x="722" y="434" width="402" height="92" rx="18"/></g>
<g fill="#111111"><text class="meta" x="78" y="466" font-size="10">RUNTIME</text><text class="ui" x="78" y="500" font-size="19">TypeScript · Bun</text><text class="meta" x="452" y="466" font-size="10">BRIDGE</text><text class="ui" x="490" y="500" font-size="20">MCP</text><text class="meta" x="746" y="466" font-size="10">MODEL CONTEXT</text><text class="ui" x="746" y="500" font-size="19">LLM tooling</text></g>
