<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Launchpad local-first desktop project library">
<style>
.still{display:none}@media (prefers-reduced-motion: reduce){.motion{display:none}.still{display:inline}}
.display{font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif;font-weight:900;letter-spacing:-3px}
.meta{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-weight:700;letter-spacing:.55px}
.ui{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;letter-spacing:-.35px}
.editorial{font-family:Georgia,"Times New Roman",serif;font-style:italic}
</style>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF7EE"/><stop offset="1" stop-color="#E9E2FF"/></linearGradient>
  <linearGradient id="world" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B6FF4A"/><stop offset="1" stop-color="#55D6FF"/></linearGradient>
</defs>
<rect width="1200" height="620" fill="url(#paper)"/>
<rect x="26" y="26" width="1148" height="568" fill="none" stroke="#111" stroke-width="5"/>
<text class="meta" x="52" y="76" font-size="15" fill="#7C5CFC">04 / DESKTOP</text>
<text class="display" x="50" y="166" font-size="88" textLength="475" lengthAdjust="spacingAndGlyphs" fill="#111">LAUNCHPAD</text>
<text class="editorial" x="54" y="210" font-size="23" fill="#111">A local-first desktop home for everything you build</text>

