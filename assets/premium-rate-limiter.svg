<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Rate Limiter animated project scene">
  <rect width="1200" height="560" fill="#FFD84D"/>
  <rect x="26" y="26" width="1148" height="508" fill="none" stroke="#111111" stroke-width="6"/>
  <text x="52" y="78" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#111111">02 / BACKEND</text>
  <text x="50" y="174" font-family="Impact, Arial Black, sans-serif" font-size="88" fill="#111111">RATE LIMITER</text>
  <text x="54" y="219" font-family="Georgia, serif" font-size="24" font-style="italic" fill="#111111">Fixed-window HTTP rate limiting from first principles</text>

  <text x="54" y="274" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#111111">POST /check · x-client-id · 5 requests / 10s</text>

  <line x1="86" y1="364" x2="974" y2="364" stroke="#111111" stroke-width="6"/>
  <rect x="946" y="306" width="32" height="116" fill="#111111"/>
  <text x="917" y="292" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#111111">LIMIT</text>

  <g>
    <circle cx="100" cy="364" r="22" fill="#B6FF4A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.82;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="364" r="22" fill="#B6FF4A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.82;1" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="364" r="22" fill="#B6FF4A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.82;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="364" r="22" fill="#B6FF4A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.82;1" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="364" r="22" fill="#B6FF4A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900" keyTimes="0;0.82;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="364" r="22" fill="#FF5C7A" stroke="#111111" stroke-width="5">
      <animate attributeName="cx" values="100;900;900;860" keyTimes="0;0.72;0.82;1" dur="6s" begin="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="364;364;364;430" keyTimes="0;0.72;0.82;1" dur="6s" begin="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1002" y="327" width="126" height="74" fill="#111111"/>
  <text x="1065" y="358" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="24" fill="#B6FF4A">200</text>
  <text x="1065" y="385" text-anchor="middle" font-family="Courier New, monospace" font-size="13" font-weight="700" fill="#F4F0E8">ALLOWED</text>

  <rect x="785" y="447" width="150" height="56" fill="#FF5C7A" stroke="#111111" stroke-width="4"/>
  <text x="860" y="482" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="26" fill="#111111">429</text>

  <rect x="54" y="456" width="152" height="44" fill="#F4F0E8" stroke="#111111" stroke-width="4"/>
  <rect x="218" y="456" width="124" height="44" fill="#F4F0E8" stroke="#111111" stroke-width="4"/>
  <rect x="354" y="456" width="92" height="44" fill="#F4F0E8" stroke="#111111" stroke-width="4"/>
  <text x="71" y="485" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#111111">TYPESCRIPT</text>
  <text x="246" y="485" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#111111">NODE.JS</text>
  <text x="378" y="485" font-family="Courier New, monospace" font-size="17" font-weight="700" fill="#111111">HTTP</text>
  <text x="1004" y="486" font-family="Arial, sans-serif" font-size="24" font-weight="900" fill="#111111">OPEN ↗</text>
</svg>