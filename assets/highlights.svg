<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Engineering principles panel">
  <rect width="1200" height="300" fill="#FFF7E6"/>
  <text x="26" y="52" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="#111111">HOW I WANT TO BUILD</text>

  <rect x="42" y="94" width="330" height="150" fill="#111111"/>
  <rect x="28" y="80" width="330" height="150" fill="#FFD93D" stroke="#111111" stroke-width="5"/>
  <text x="52" y="122" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#111111">01 // FIRST PRINCIPLES</text>
  <text x="52" y="162" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">Understand the mechanism.</text>
  <text x="52" y="190" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">Not just the framework.</text>

  <rect x="435" y="94" width="330" height="150" fill="#111111"/>
  <rect x="421" y="80" width="330" height="150" fill="#8EF6D0" stroke="#111111" stroke-width="5"/>
  <text x="445" y="122" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#111111">02 // EVIDENCE</text>
  <text x="445" y="162" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">Tests, working demos,</text>
  <text x="445" y="190" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">measurable behavior.</text>

  <rect x="828" y="94" width="330" height="150" fill="#111111"/>
  <rect x="814" y="80" width="330" height="150" fill="#FF6B9A" stroke="#111111" stroke-width="5"/>
  <text x="838" y="122" font-family="Arial Black, Arial, sans-serif" font-size="20" font-weight="900" fill="#111111">03 // SHIP</text>
  <text x="838" y="162" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">Real output beats</text>
  <text x="838" y="190" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111111">imaginary expertise.</text>
</svg>