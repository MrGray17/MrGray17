<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Portfolio route map">
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="1200" height="220" fill="#111111"/>
<text x="38" y="42" font-family="Courier New,monospace" font-size="15" font-weight="700" fill="#B6FF4A">ROUTE / 01 → 05</text>
<line x1="70" y1="116" x2="1110" y2="116" stroke="#F4F0E8" stroke-width="3"/>
<g font-family="Courier New,monospace" font-size="13" font-weight="700" fill="#F4F0E8" text-anchor="middle">
  <circle cx="110" cy="116" r="16" fill="#B6FF4A" stroke="#F4F0E8" stroke-width="3"/>
  <circle cx="350" cy="116" r="16" fill="#FFD84D" stroke="#F4F0E8" stroke-width="3"/>
  <circle cx="590" cy="116" r="16" fill="#FF5CA8" stroke="#F4F0E8" stroke-width="3"/>
  <circle cx="830" cy="116" r="16" fill="#E9E2FF" stroke="#F4F0E8" stroke-width="3"/>
  <circle cx="1070" cy="116" r="16" fill="#55D6FF" stroke="#F4F0E8" stroke-width="3"/>
  <text x="110" y="82">01</text><text x="350" y="82">02</text><text x="590" y="82">03</text><text x="830" y="82">04</text><text x="1070" y="82">05</text>
  <text x="110" y="166">OPENTOKEN</text><text x="350" y="166">RATE LIMITER</text><text x="590" y="166">MAW3ID</text><text x="830" y="166">STACK</text><text x="1070" y="166">ARCADE</text>
</g>
<circle cx="110" cy="116" r="28" fill="none" stroke="#B6FF4A" stroke-width="3" opacity="0.8"><animate attributeName="r" values="20;30;20" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/></circle>
</svg>