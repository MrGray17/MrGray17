  <g transform="translate(330 82)" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace"><text fill="#7ee787" font-size="14">REPLAY.LOG</text><text y="48" fill="#f0f6fc" font-size="18">01  e2 → e4    control the center</text><text y="86" fill="#8b949e" font-size="18">02  g8 → f6    develop with tempo</text><text y="124" fill="#58a6ff" font-size="18">03  inspect → predict → move</text><text y="162" fill="#d2a8ff" font-size="18">04  constraints create strategy</text><text y="215" fill="#8b949e" font-size="15">same rule in engineering: every move buys something and costs something.</text></g>
