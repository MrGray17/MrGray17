  </rect>
  <text x="269" y="449" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="700" fill="#F4F0E8">TODAY'S FLOW</text>

  <rect x="606" y="260" width="516" height="236" fill="url(#mapbg)" stroke="#111111" stroke-width="5"/>
  <text x="632" y="300" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#111111">MAP / SEARCH</text>
  <path d="M640 336 C710 300 770 390 836 348 S960 300 1084 370" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="9 10"/>

