name: Generate profile animations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - ".github/workflows/animations.yml"

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: MrGray17
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate Space Shooter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check "gh-space-shooter==2.0.4"
          mkdir -p dist
          gh-space-shooter MrGray17 \
            --output dist/space-shooter.gif \
            --strategy random \
            --fps 30

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
