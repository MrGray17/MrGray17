name: Generate profile animations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - ".github/workflows/animations.yml"

permissions:
  contents: write

concurrency:
  group: profile-animations
  cancel-in-progress: true

jobs:
  snake:
    name: Generate contribution snake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shooter:
    name: Generate contribution space shooter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Generate and commit Space Shooter
        uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: MrGray17
          output-path: space-shooter.gif
          strategy: random
          fps: 30
