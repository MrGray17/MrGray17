<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="MrGray17 animated systems profile hero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#39d353" stop-opacity="0"/>
      <stop offset=".5" stop-color="#39d353" stop-opacity=".95"/>
      <stop offset="1" stop-color="#39d353" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="44" y="55" fill="#8b949e" font-size="18">mrgray17@github:~$ boot-profile</text>
    <circle cx="1088" cy="50" r="6" fill="#238636"/>
    <text x="1105" y="56" fill="#7ee787" font-size="14">ONLINE</text>

    <text x="44" y="105" fill="#39d353" font-size="18" opacity="0">
      &gt; initializing systems profile...
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.08;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="44" y="136" fill="#58a6ff" font-size="18" opacity="0">
      &gt; loading backend / distributed systems / AI infrastructure
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.24;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="44" y="167" fill="#d2a8ff" font-size="18" opacity="0">
      &gt; scanning repositories... signal acquired
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.36;1" dur="8s" repeatCount="indefinite"/>
    </text>

    <text x="44" y="235" fill="#f0f6fc" font-size="46" font-weight="700">MRGRAY17</text>
    <text x="44" y="274" fill="#8b949e" font-size="22">software engineer · systems builder · AI infrastructure</text>
    <text x="44" y="310" fill="#7ee787" font-size="17">BUILDING &gt; BADGES   DEPTH &gt; DECORATION   SHIPPING &gt; TALKING</text>
  </g>

  <rect x="42" y="327" width="1116" height="2" fill="#21262d"/>
  <rect x="42" y="327" width="220" height="2" fill="url(#scan)" filter="url(#glow)">
    <animate attributeName="x" values="42;938;42" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
